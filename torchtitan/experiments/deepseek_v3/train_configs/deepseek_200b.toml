# Instella-200b (deepseek-v3 like)

[job]
dump_folder = "./instella-200b-bf16-bs7-fsdp4-ep8-outputs"
description = "Instella-200b training"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "DeepSeek"
flavor = "200b"
tokenizer_path = "./assets/tokenizer/original/tokenizer.model"
# converters = ["float8"]

[optimizer]
name = "AdamW"
lr = 2.2e-4
eps = 1e-6
# B1 = 0.9 / B2 = 0.95

[lr_scheduler]
warmup_steps = 600  # lr scheduler warm up, normally 20% of the train steps
decay_ratio = 0.8  # lr scheduler decay ratio, 80% of the train steps
decay_type = "linear"
lr_min = 0.1

[training]
local_batch_size = 7
seq_len = 4096
max_norm = 1.0  # grad norm clipping
steps = 3000
compile = true
dataset = "c4"
seed = 1

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 8
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1
enable_compiled_autograd = false
enable_tp2ep = true

[checkpoint]
enable_checkpoint = false
folder = "checkpoint"
interval = 200
model_weights_only = false
export_dtype = "bfloat16"
async_mode = "async"  # ["disabled", "async", "async_with_pinned_mem"]
keep_latest_k = 2

[activation_checkpoint]
mode = 'none'  # ['none', 'selective', 'full']
selective_ac_option = '1'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output", "router.gate", "self_attn.q_a_proj", "self_attn.q_b_proj", "self_attn.kv_a_proj_with_mqa", "self_attn.kv_b_proj", "self_attn.q_proj", "self_attn.o_proj"]
enable_fp8_fa = true
fp8_fa_granularity = "blockwise"
enable_fp8_gmm = true
enable_fp8_linear = true
recipe_name = "blockwise"
